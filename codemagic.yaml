workflows:
  ios-release:
    name: EUSAI Hub iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: eusai_messenger_app
    environment:
      flutter: stable
      xcode: latest
      groups:
        - apple_credentials # Create this group in Codemagic Settings -> Environment Variables
      vars:
        APP_ID: com.eusaiteam.hub
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - kamlesh7461@gmail.com
